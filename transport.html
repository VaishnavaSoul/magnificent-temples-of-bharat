<!DOCTYPE html>
<html>
<head>
    <title>Transport Facilities – Ritual Realms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: url('images/krishna-bg.jpg') center/cover fixed no-repeat;
            font-family: 'Segoe UI', sans-serif;
        }

        .overlay-page {
            background: rgba(0,0,0,0.65);
            min-height: 100vh;
            padding: 20px 10px 60px;
        }

        /* SEARCH BAR */
        .search-box {
            width: 95%;
            max-width: 700px;
            margin: 20px auto 30px;
            display: block;
            padding: 14px 18px;
            font-size: 18px;
            border-radius: 40px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.9);
        }

        /* TEMPLE CARD */
        .temple-card {
            width: 95%;
            max-width: 900px;
            height: 220px;
            margin: 25px auto;
            border-radius: 22px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255,215,0,0.45);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .temple-card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(255,215,0,0.75);
        }

        .temple-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(75%);
        }

        .temple-name {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 18px 15px;
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            letter-spacing: 1px;
        }
    
/* Dark themed search bar override */
.search-bar input,
.search-box input{
  background:#0f1115 !important;
  color:#f5f5f5 !important;
  border:1px solid #2a2f3a !important;
}
.search-bar input::placeholder,
.search-box input::placeholder{
  color:#9aa3b2 !important;
}
.search-bar input:focus,
.search-box input:focus{
  outline:none !important;
  border-color:#ffd54a !important;
  box-shadow:0 0 10px rgba(255,213,74,0.45) !important;
}
</style>
</head>

<body>
<div class="overlay-page">

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search temple..." onkeyup="searchTemple()">

    <div class="temple-card" data-name="meenakshi" onclick="openTemple('Arulmigu Meenakshi Amman Temple , Madurai')">
        <img src="images/meenakshi.jpg" class="temple-img">
        <div class="temple-name">Madurai Meenakshi Amman Temple</div>
    </div>

    <div class="temple-card" data-name="tirupati" onclick="openTemple('Sri Venkateshwara Swamy Temple , Tirumala')">
        <img src="images/tirupati.jpg" class="temple-img">
        <div class="temple-name">Tirupati Balaji Temple</div>
    </div>

    <div class="temple-card" data-name="veeraragava" onclick="openTemple('Sri Vaidhya Veeraragava Swamy Temple , Thiruvallur')">
        <img src="images/veeraragava.jpg" class="temple-img">
        <div class="temple-name">Thiruvallur Veeraraghava Perumal Temple</div>
    </div>

    <div class="temple-card" data-name="nellore" onclick="openTemple('Thalpagiri Sri Ranganatha Swamy Temple , Nellore')">
        <img src="images/nellore.jpg" class="temple-img">
        <div class="temple-name">Nellore Ranganatha Swamy Temple</div>
    </div>

    <div class="temple-card" data-name="tanjore" onclick="openTemple('Sri Brihadeeshwara Temple , Thanjavur')">
        <img src="images/tanjore.jpg" class="temple-img">
        <div class="temple-name">Thanjavur Brihadeeswarar Temple</div>
    </div>

</div>

<script>
function searchTemple() {
    let input = document.getElementById('searchInput').value.toLowerCase();
    let cards = document.querySelectorAll('.temple-card');

    cards.forEach(card => {
        let name = card.getAttribute('data-name');
        card.style.display = name.includes(input) ? 'block' : 'none';
    });
}
</script>
<script>
function openTemple(templeName){

  // Save selected temple for next pages
  localStorage.setItem("selectedTemple", templeName);

  // Go to temple options page
  window.location.href = "temple-options.html";
}
</script>
</body>
</html>
