<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Ritual Realms</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: 
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
    url("images/krishna.jpg") no-repeat center center/cover;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.signup-container {
  width: 400px;
  background: #0d0d0d;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(255, 140, 0, 0.6);
  border: 1px solid rgba(255,140,0,0.3);
}

.logo {
  text-align: center;
  font-size: 28px;
  font-weight: 600;
  color: #ffd700;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #ffa500;
  margin-bottom: 30px;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  font-size: 13px;
  color: #ffd700;
}

.input-group input {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: #1c1c1c;
  color: white;
  transition: 0.3s;
}

.input-group input:focus {
  box-shadow: 0 0 10px #ffa500;
}

.signup-btn {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg, #ffd700, #ffa500);
  color: black;
  font-weight: 600;
  cursor: pointer;
  transition: 0.4s;
}

.signup-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #ffa500;
}

.extra-options {
  margin-top: 15px;
  font-size: 12px;
  text-align: center;
  color: #aaa;
}

.extra-options a {
  color: #ffd700;
  text-decoration: none;
}

.extra-options a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="signup-container">
  <div class="logo">Ritual Realms ✨</div>
  <div class="subtitle">Begin Your Divine Journey</div>

  <!-- IMPORTANT: Added id="signupForm" -->
  <form id="signupForm">

    <div class="input-group">
      <label>Full Name</label>
      <input id="fullname" type="text" placeholder="Enter your name" required>
    </div>

    <div class="input-group">
      <label>Username</label>
      <input id="username" type="text" placeholder="@devotee123" required>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input id="email" type="email" placeholder="you@example.com" required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input id="password" type="password" placeholder="Create a strong password" required>
    </div>

    <!-- IMPORTANT: type="submit" added -->
    <button type="submit" class="signup-btn">
      Create Account 🚀
    </button>

  </form>

  <div class="extra-options">
    Already have an account? <a href="#">Login</a>
  </div>
</div>

<!-- IMPORTANT: Firebase signup script -->
<script type="module" src="signup.js"></script>

</body>
</html>
