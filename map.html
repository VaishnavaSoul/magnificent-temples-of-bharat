<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DYX852KFZP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-DYX852KFZP');

  <title>Temple Map Explorer – The Magnificent Temples of Bharat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<style>
/* Footer */
.footer {
  background: #111;
  color: #ffd700;
  text-align: center;
  padding: 20px 0;
  font-size: 16px;
  box-shadow: 0 -3px 15px rgba(255,153,51,0.5);
  margin-top: 40px;
}

.footer .line {
  color: #ff9933;
  font-style: italic;
  font-size: 14px;
  margin-top: 5px;
}

/* MAP */
.map-container{
  position:relative;
  width:500px;
  max-width:90%;
  margin:30px auto;
}

.india-map{
  width:100%;
  border-radius:12px;
  box-shadow:0 0 20px rgba(255,153,51,0.4);
}

/* TEMPLE PIN STYLE */
.map-pin{
  position:absolute;
  background:linear-gradient(45deg,#ff9933,#ffd700);
  color:#000;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  text-decoration:none;
  transform:translate(-50%,-50%);
  cursor:pointer;
  white-space:nowrap;
  transition:0.3s;
}

.map-pin:hover{
  transform:translate(-50%,-50%) scale(1.1);
  box-shadow:0 0 12px gold;
}
</style>
<div class="overlay">

  <header>
    <h1>🗺️ Temple Map Explorer</h1>
    <p>Discover temples visually across Bharat</p>
  </header>

  <!-- INDIA MAP -->
  <div class="map-container">

  <img src="images/india-map.png" class="india-map" alt="India Temple Map">

  <!-- PINS WILL APPEAR HERE -->
  <div id="mapPins"></div>

  </div>

    <!-- State Buttons -->
    <div class="state-buttons">
      <button onclick="showTemples('tn')">Tamil Nadu</button>
      <button onclick="showTemples('ap')">Andhra Pradesh</button>
      <button onclick="showTemples('ka')">Karnataka</button>
    </div>
  </section>

  <section class="intro" id="templeList" style="display:none;">
    <h2>Temples</h2>
    <div id="temples"></div>
  </section>

  <!-- Footer -->
  <div class="footer">
  © 2026 Ritual Realms. All rights reserved.
  <div class="line">“Every sacred journey begins with devotion and faith.”</div>
  </div>

</div>
<script>
function showTemples(state) {

  const container = document.getElementById("temples");
  const section = document.getElementById("templeList");
  const mapPins = document.getElementById("mapPins");

  container.innerHTML = "";
  mapPins.innerHTML = ""; // clears old pins

  let temples = [];

  /* ---------- TAMIL NADU ---------- */
  if (state === "tn") {
    temples = [
      {
        name: "Meenakshi Amman Temple",
        link: "temples/meenakshi.html",
        top: "89%",
        left: "55%"
      },
      {
        name: "Chidambaram Nataraja Temple",
        link: "temples/chidambaram.html",
        top: "86%",
        left: "61%"
      },
      {
        name: "Brihadeeshwara Temple",
        link: "temples/brihadeeshwara.html",
        top: "87%",
        left: "56%"
      }
    ];
  }

  /* ---------- ANDHRA PRADESH ---------- */
  if (state === "ap") {
    temples = [
      {
        name: "Tirupati Balaji",
        link: "temples/tirupati.html",
        top: "70%",
        left: "73%"
      },
      {
        name: "Srikalahasti",
        link: "#",
        top: "67%",
        left: "74%"
      }
    ];
  }

  /* ---------- KARNATAKA ---------- */
  if (state === "ka") {
    temples = [
      {
        name: "Udupi Krishna Temple",
        link: "#",
        top: "70%",
        left: "60%"
      }
    ];
  }

  /* CREATE BUTTONS + MAP PINS */
  temples.forEach(t => {

    // Temple button list
    const btn = document.createElement("button");
    btn.className = "login-btn";
    btn.style.margin = "10px";
    btn.innerText = t.name;
    btn.onclick = () => window.location.href = t.link;
    container.appendChild(btn);

    // Map pin
    const pin = document.createElement("a");
    pin.className = "map-pin";
    pin.innerText = "📍 " + t.name;
    pin.href = t.link;
    pin.style.top = t.top;
    pin.style.left = t.left;

    mapPins.appendChild(pin);
  });

  section.style.display = "block";
}
</script>
<script>
const savedSong = localStorage.getItem("currentSong");

if (savedSong) {
  let player = document.getElementById("globalPlayer");

  if (!player) {
    player = document.createElement("audio");
    player.id = "globalPlayer";
    document.body.appendChild(player);
  }

  player.src = savedSong;
  player.volume = 0.4;
  player.play().catch(() => {});
}
</script>
</body>
</html>
