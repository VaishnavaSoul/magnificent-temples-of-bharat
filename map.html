<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];

  gtag('config', 'G-DYX852KFZP');

  <title>Temple Map Explorer – The Magnificent Temples of Bharat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<style>
/* Footer */
.footer {
  background: #111;
  color: #ffd700;
  text-align: center;
  padding: 20px 0;
  font-size: 16px;
  box-shadow: 0 -3px 15px rgba(255,153,51,0.5);
  margin-top: 40px;
}

.footer .line {
  color: #ff9933;
  font-style: italic;
  font-size: 14px;
  margin-top: 5px;
}
</style>
<div class="overlay">

  <header>
    <h1>🗺️ Temple Map Explorer</h1>
    <p>Discover temples visually across Bharat</p>
  </header>

  <div style="text-align:center; margin: 30px 0;">
  <img 
    src="images/india-map.png"
    alt="India Temple Map"
    style="width:500px; max-width:90%; border-radius:12px;">
  </div>

    <!-- State Buttons -->
    <div class="state-buttons">
      <button onclick="showTemples('tn')">Tamil Nadu</button>
      <button onclick="showTemples('ap')">Andhra Pradesh</button>
      <button onclick="showTemples('ka')">Karnataka</button>
    </div>
  </section>

  <section class="intro" id="templeList" style="display:none;">
    <h2>Temples</h2>
    <div id="temples"></div>
  </section>

  <!-- Footer -->
  <div class="footer">
  © 2026 Ritual Realms. All rights reserved.
  <div class="line">“Every sacred journey begins with devotion and faith.”</div>
  </div>

</div>

<script>
function showTemples(state) {
  const container = document.getElementById("temples");
  const section = document.getElementById("templeList");
  container.innerHTML = "";

  let temples = [];

  if (state === "tn") {
    temples = [
      { name: "Meenakshi Amman Temple", link: "temples/meenakshi.html" },
      { name: "Chidambaram Nataraja Temple", link: "#" },
      { name: "Brihadeeshwara Temple", link: "#" }
    ];
  }

  if (state === "ap") {
    temples = [
      { name: "Tirupati Balaji", link: "temples/tirupati.html" },
      { name: "Srikalahasti", link: "#" }
    ];
  }

  if (state === "ka") {
    temples = [
      { name: "Udupi Krishna Temple", link: "#" }
    ];
  }

  temples.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "login-btn";
    btn.style.margin = "10px";
    btn.innerText = t.name;
    btn.onclick = () => window.location.href = t.link;
    container.appendChild(btn);
  });

  section.style.display = "block";
}
</script>
<script>
const savedSong = localStorage.getItem("currentSong");

if (savedSong) {
  let player = document.getElementById("globalPlayer");

  if (!player) {
    player = document.createElement("audio");
    player.id = "globalPlayer";
    document.body.appendChild(player);
  }

  player.src = savedSong;
  player.volume = 0.4;
  player.play().catch(() => {});
}
</script>
</body>
</html>
