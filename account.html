<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Divine Profile | Ritual Realms</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
    url("images/krishna.jpg") no-repeat center center/cover;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 0;
  color: white;
}

.account-container {
  width: 500px;
  background: #0d0d0d;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(255, 140, 0, 0.6);
  border: 1px solid rgba(255,140,0,0.3);
}

.logo {
  text-align: center;
  font-size: 26px;
  font-weight: 600;
  color: #ffd700;
  margin-bottom: 30px;
}

.section-title {
  margin: 25px 0 15px;
  font-size: 15px;
  color: #ffa500;
  border-bottom: 1px solid rgba(255,165,0,0.3);
  padding-bottom: 5px;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  font-size: 13px;
  color: #ffd700;
}

.input-group input,
.input-group select,
.input-group textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: #1c1c1c;
  color: white;
}

textarea {
  resize: none;
  height: 70px;
}

.checkbox-group {
  margin-top: 10px;
  font-size: 13px;
}

.checkbox-group label {
  display: block;
  margin-bottom: 6px;
}

.save-btn {
  width: 100%;
  padding: 12px;
  margin-top: 25px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg, #ffd700, #ffa500);
  color: black;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.save-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 0 20px #ffa500;
}
</style>
</head>

<body>

<div class="account-container">
  <div class="logo">Build Your Divine Identity ✨</div>

  <form id="accountForm">

    <!-- PERSONAL INFO -->
    <div class="section-title">Personal Information</div>

    <div class="input-group">
      <label>Full Name</label>
      <input id="fullname" type="text">
    </div>

    <div class="input-group">
      <label>Username</label>
      <input id="username" type="text">
    </div>

    <div class="input-group">
      <label>Email</label>
      <input id="email" type="email" disabled>
    </div>

    <div class="input-group">
      <label>Date of Birth</label>
      <input id="dob" type="date">
    </div>

    <div class="input-group">
      <label>Gender</label>
      <select id="gender">
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <!-- DEVOTIONAL IDENTITY -->
    <div class="section-title">Devotional Identity</div>

    <div class="input-group">
      <label>Favourite Deity</label>
      <input id="deity" type="text">
    </div>

    <div class="input-group">
      <label>Favourite Temple</label>
      <input id="temple" type="text">
    </div>

    <div class="input-group">
      <label>Rasi (Zodiac Sign)</label>
      <input id="rasi" type="text">
    </div>

    <div class="input-group">
      <label>Nakshatra (Birth Star)</label>
      <input id="nakshatra" type="text">
    </div>

    <div class="input-group">
      <label>Spiritual Goal</label>
      <select id="goal">
        <option value="">Select</option>
        <option>Peace</option>
        <option>Prosperity</option>
        <option>Devotion</option>
        <option>Knowledge</option>
        <option>Health</option>
      </select>
    </div>

    <!-- PREFERENCES -->
    <div class="section-title">Preferences</div>

    <div class="input-group">
      <label>Language Preference</label>
      <input id="language" type="text">
    </div>

    <div class="checkbox-group">
      <label><input type="checkbox" value="Slokas"> Daily Slokas</label>
      <label><input type="checkbox" value="Temple History"> Temple History</label>
      <label><input type="checkbox" value="Festivals"> Festivals</label>
      <label><input type="checkbox" value="Astrology"> Astrology</label>
      <label><input type="checkbox" value="Bhajans"> Bhajans</label>
      <label><input type="checkbox" value="Meditation"> Meditation</label>
    </div>

    <div class="input-group">
      <label>Receive Sacred Reminders?</label>
      <select id="notifications">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <!-- SPIRITUAL JOURNEY -->
    <div class="section-title">Spiritual Journey</div>

    <div class="input-group">
      <label>Family Deity (Kuladeivam)</label>
      <input id="familyDeity" type="text">
    </div>

    <div class="input-group">
      <label>Favorite Mantra</label>
      <textarea id="mantra"></textarea>
    </div>

    <div class="input-group">
      <label>Pilgrimage Wishlist</label>
      <textarea id="wishlist"></textarea>
    </div>

    <div class="input-group">
      <label>Temples Visited</label>
      <textarea id="visited"></textarea>
    </div>

    <button type="submit" class="save-btn">
      Save My Divine Profile 💾
    </button>

  </form>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { doc, getDoc, updateDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("accountForm");

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "signup.html";
    return;
  }

  const docRef = doc(db, "users", user.uid);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {
    const data = docSnap.data();

    document.getElementById("fullname").value = data.fullname || "";
    document.getElementById("username").value = data.username || "";
    document.getElementById("email").value = data.email || "";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const interests = Array.from(
      document.querySelectorAll(".checkbox-group input:checked")
    ).map(cb => cb.value);

    await updateDoc(docRef, {
      fullname: fullname.value,
      username: username.value,
      dob: dob.value,
      gender: gender.value,
      rasi: rasi.value,
      nakshatra: nakshatra.value,
      goal: goal.value,
      language: language.value,
      notifications: notifications.value,
      familyDeity: familyDeity.value,
      mantra: mantra.value,
      wishlist: wishlist.value,
      visited: visited.value,
      favorites: {
        deity: deity.value,
        temples: [temple.value]
      },
      interests: interests
    });

    alert("✨ Divine Profile Updated Successfully!");
  });

});
</script>
<script type="module">
import { auth } from "./firebase-config.js";
import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "signup.html";
  }
});
</script>
</body>
</html>
